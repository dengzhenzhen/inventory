name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and smoke-test Inventory.exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-exe.txt

      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm packaging/app.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:INVENTORY_NO_BROWSER = '1'
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'

          $root = (Get-Location).Path
          $dist = Join-Path $root 'dist'
          $exe = Join-Path $dist 'Inventory.exe'
          $logs = Join-Path $root 'smoke-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $script:smokeLog = Join-Path $logs 'smoke.log'
          $script:stdinFile = Join-Path $logs 'stdin.txt'
          Set-Content -Path $script:stdinFile -Value '' -Encoding ASCII
          $base = 'http://127.0.0.1:8000'

          function Write-SmokeLog {
              param([string]$Message)
              $line = '[{0}] {1}' -f (Get-Date -Format 'HH:mm:ss'), $Message
              Write-Host $line
              Add-Content -Path $script:smokeLog -Value $line -Encoding UTF8
          }

          function Fail-Smoke {
              param([string]$Message)
              Write-SmokeLog "FAIL: $Message"
              throw $Message
          }

          function Pass-Smoke {
              param([string]$Message)
              Write-SmokeLog "PASS: $Message"
          }

          function Test-Health {
              & curl.exe -s -f -o NUL "$base/api/health" 2>$null
              return ($LASTEXITCODE -eq 0)
          }

          function Wait-Health {
              param([int]$TimeoutSeconds = 60)
              $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
              while ((Get-Date) -lt $deadline) {
                  if (Test-Health) { return $true }
                  Start-Sleep -Seconds 2
              }
              return $false
          }

          function Wait-HealthDown {
              param([int]$TimeoutSeconds = 15)
              $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
              while ((Get-Date) -lt $deadline) {
                  if (-not (Test-Health)) { return $true }
                  Start-Sleep -Milliseconds 500
              }
              return $false
          }

          function Get-HttpStatus {
              param([string]$Url)
              $output = & curl.exe -s -o NUL -w '%{http_code}' $Url
              return ($output -join '').Trim()
          }

          function Start-Inventory {
              param(
                  [string]$ExePath,
                  [string]$OutLog,
                  [string]$ErrLog
              )
              $startArgs = @{
                  FilePath = $ExePath
                  PassThru = $true
                  NoNewWindow = $true
                  RedirectStandardOutput = $OutLog
                  RedirectStandardError = $ErrLog
                  RedirectStandardInput = $script:stdinFile
              }
              return Start-Process @startArgs
          }

          function Test-Running {
              param([System.Diagnostics.Process]$Process)
              if ($null -eq $Process) { return $false }
              $Process.Refresh()
              return (-not $Process.HasExited)
          }

          function Stop-InventoryProcess {
              param([System.Diagnostics.Process]$Process)
              if ($null -ne $Process) {
                  try {
                      if (-not $Process.HasExited) {
                          & taskkill.exe /PID $Process.Id /T /F 2>$null | Out-Null
                      }
                  } catch { }
                  try {
                      Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
                  } catch { }
              }
              Get-Process -Name 'Inventory' -ErrorAction SilentlyContinue | ForEach-Object {
                  try { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue } catch { }
              }
              if (-not (Wait-HealthDown 20)) {
                  $listeners = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue
                  foreach ($listener in $listeners) {
                      try { & taskkill.exe /PID $listener.OwningProcess /T /F 2>$null | Out-Null } catch { }
                  }
                  if (-not (Wait-HealthDown 10)) {
                      Write-SmokeLog 'WARN: port 8000 is still serving after cleanup'
                  }
              }
              Start-Sleep -Milliseconds 500
          }

          $p1 = $null
          $p2 = $null
          $p3 = $null
          $p4 = $null
          $listener = $null

          try {
              if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
                  Fail-Smoke 'dist/Inventory.exe was not produced'
              }
              Pass-Smoke "dist/Inventory.exe exists ($((Get-Item -LiteralPath $exe).Length) bytes)"

              $existingListener = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue
              if ($existingListener) {
                  Fail-Smoke 'port 8000 is already in use before the smoke test'
              }

              # 1) Launch the packaged exe and wait for /api/health (up to 60s).
              $p1 = Start-Inventory -ExePath $exe -OutLog (Join-Path $logs 'run1.stdout.log') -ErrLog (Join-Path $logs 'run1.stderr.log')
              if (-not (Wait-Health 60)) {
                  Stop-InventoryProcess $p1
                  $stderrText = ''
                  $stderrPath = Join-Path $logs 'run1.stderr.log'
                  if (Test-Path -LiteralPath $stderrPath) {
                      $stderrText = Get-Content -Raw -Encoding UTF8 $stderrPath
                  }
                  Fail-Smoke "health check timed out after 60s; stderr: $stderrText"
              }
              if (-not (Test-Running $p1)) {
                  Fail-Smoke 'first instance exited unexpectedly'
              }
              Pass-Smoke 'health endpoint is up (60s budget)'

              # 2) Runtime files must be created next to the exe.
              foreach ($rel in @('config.ini', 'data/inventory.db')) {
                  $full = Join-Path $dist $rel
                  if (-not (Test-Path -LiteralPath $full)) {
                      Fail-Smoke "missing exe-adjacent $rel"
                  }
              }
              if (-not (Test-Path -LiteralPath (Join-Path $dist 'static/images') -PathType Container)) {
                  Fail-Smoke 'missing exe-adjacent static/images/'
              }
              Pass-Smoke 'config.ini, data/inventory.db and static/images/ exist next to the exe'

              # 3) SPA shell and OpenAPI schema.
              $indexPath = Join-Path $logs 'index.html'
              & curl.exe -sS -f -o $indexPath "$base/" 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Fail-Smoke 'GET / failed'
              }
              $indexHtml = Get-Content -Raw -Encoding UTF8 $indexPath
              if ($indexHtml -notmatch 'id="app"') {
                  Fail-Smoke 'index.html does not contain id="app"'
              }
              Pass-Smoke 'GET / serves the SPA shell (id="app")'

              $statusCode = Get-HttpStatus "$base/openapi.json"
              if ($statusCode -ne '200') {
                  Fail-Smoke "GET /openapi.json returned $statusCode"
              }
              Pass-Smoke 'GET /openapi.json returned 200'

              # 4) Login and verify the frozen seed leaves products empty.
              $loginRequest = Join-Path $logs 'login-request.json'
              [System.IO.File]::WriteAllText($loginRequest, '{"username":"admin","password":"admin123"}', [System.Text.UTF8Encoding]::new($false))
              $loginResponse = Join-Path $logs 'login.json'
              & curl.exe -sS -f -X POST -H 'Content-Type: application/json' --data-binary "@$loginRequest" -o $loginResponse "$base/api/auth/login" 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Fail-Smoke 'login request failed'
              }
              $login = [System.IO.File]::ReadAllText($loginResponse, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
              $token = $login.data.access_token
              if ([string]::IsNullOrWhiteSpace($token)) {
                  Fail-Smoke 'login response has no data.access_token'
              }
              Pass-Smoke 'login admin/admin123 returned data.access_token'

              $productsResponse = Join-Path $logs 'products.json'
              & curl.exe -sS -f -H "Authorization: Bearer $token" -o $productsResponse "$base/api/products" 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Fail-Smoke 'GET /api/products failed'
              }
              $products = [System.IO.File]::ReadAllText($productsResponse, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
              $items = @($products.data.items)
              if ($items.Count -ne 0) {
                  Fail-Smoke "expected an empty product list, got $($items.Count) items"
              }
              if ([int]($products.data.total) -ne 0) {
                  Fail-Smoke "expected data.total == 0, got $($products.data.total)"
              }
              Pass-Smoke 'seeded product list is empty (data.items == [] and data.total == 0)'

              # 5) Upload a 1x1 PNG and export a real xlsx (PK magic).
              $pngPath = Join-Path $logs 'pixel.png'
              $pngBase64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='
              [System.IO.File]::WriteAllBytes($pngPath, [Convert]::FromBase64String($pngBase64))
              $uploadResponse = Join-Path $logs 'upload.json'
              & curl.exe -sS -f -H "Authorization: Bearer $token" -F "file=@$pngPath" -o $uploadResponse "$base/api/upload/image" 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Fail-Smoke 'image upload failed'
              }
              $upload = [System.IO.File]::ReadAllText($uploadResponse, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
              $imageRel = $upload.data.path
              if ($imageRel -notmatch '^images/[0-9a-f]+\.jpg$') {
                  Fail-Smoke "unexpected upload path: $imageRel"
              }
              $imageFull = [System.IO.Path]::Combine($dist, 'static', ($imageRel -replace '/', '\'))
              if (-not (Test-Path -LiteralPath $imageFull -PathType Leaf)) {
                  Fail-Smoke "uploaded image missing: $imageFull"
              }
              Pass-Smoke "upload returned $imageRel and the file exists"

              $stockPath = Join-Path $logs 'stock.xlsx'
              & curl.exe -sS -f -H "Authorization: Bearer $token" -o $stockPath "$base/api/export/stock.xlsx" 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Fail-Smoke 'stock export request failed'
              }
              $stockBytes = [System.IO.File]::ReadAllBytes($stockPath)
              if ($stockBytes.Length -lt 2 -or $stockBytes[0] -ne 0x50 -or $stockBytes[1] -ne 0x4B) {
                  Fail-Smoke 'stock.xlsx does not start with PK'
              }
              Pass-Smoke 'stock.xlsx export starts with PK'

              # 6) A second launch must exit successfully while the first stays healthy.
              $p2 = Start-Inventory -ExePath $exe -OutLog (Join-Path $logs 'run2.stdout.log') -ErrLog (Join-Path $logs 'run2.stderr.log')
              if (-not $p2.WaitForExit(30000)) {
                  Stop-InventoryProcess $p2
                  Fail-Smoke 'second instance did not exit within 30s'
              }
              $p2.Refresh()
              if ($p2.ExitCode -ne 0) {
                  Fail-Smoke "second instance exited with code $($p2.ExitCode)"
              }
              if (-not (Wait-Health 10)) {
                  Fail-Smoke 'health endpoint is not 200 after the second launch'
              }
              if (-not (Test-Running $p1)) {
                  Fail-Smoke 'first instance died after the second launch'
              }
              Pass-Smoke 'second launch exited 0 and the first instance stayed healthy'

              # 7) Non-ASCII install path: copy only the exe, let it create config/data.
              Stop-InventoryProcess $p1
              $p1 = $null
              Pass-Smoke 'first instance stopped before the non-ASCII path test'

              $unicodeDir = Join-Path $env:RUNNER_TEMP '进销存'
              New-Item -ItemType Directory -Force -Path $unicodeDir | Out-Null
              $unicodeExe = Join-Path $unicodeDir 'Inventory.exe'
              Copy-Item -LiteralPath $exe -Destination $unicodeExe -Force
              $p3 = Start-Inventory -ExePath $unicodeExe -OutLog (Join-Path $logs 'run-unicode.stdout.log') -ErrLog (Join-Path $logs 'run-unicode.stderr.log')
              if (-not (Wait-Health 60)) {
                  Stop-InventoryProcess $p3
                  $stderrText = ''
                  $stderrPath = Join-Path $logs 'run-unicode.stderr.log'
                  if (Test-Path -LiteralPath $stderrPath) {
                      $stderrText = Get-Content -Raw -Encoding UTF8 $stderrPath
                  }
                  Fail-Smoke "non-ASCII path launch did not become healthy; stderr: $stderrText"
              }
              if (-not (Test-Path -LiteralPath (Join-Path $unicodeDir 'config.ini'))) {
                  Fail-Smoke 'non-ASCII run did not generate config.ini next to the exe'
              }
              if (-not (Test-Path -LiteralPath (Join-Path $unicodeDir 'data/inventory.db'))) {
                  Fail-Smoke 'non-ASCII run did not generate data/inventory.db'
              }
              Pass-Smoke "non-ASCII path launch works: $unicodeDir"
              Stop-InventoryProcess $p3
              $p3 = $null

              # 8) An external listener occupying the configured port must cause a clean failure.
              $conflictPort = 8001
              $env:PORT = "$conflictPort"
              $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, $conflictPort)
              $listener.ExclusiveAddressUse = $true
              try {
                  $listener.Start()
              } catch {
                  $listener = $null
                  Remove-Item Env:PORT -ErrorAction SilentlyContinue
                  Fail-Smoke "could not bind dummy TcpListener on port ${conflictPort}: $($_.Exception.Message)"
              }
              if (-not $listener.Server.IsBound) {
                  $listener.Stop()
                  $listener = $null
                  Remove-Item Env:PORT -ErrorAction SilentlyContinue
                  Fail-Smoke "dummy TcpListener did not bind port $conflictPort"
              }
              $holding = Get-NetTCPConnection -LocalPort $conflictPort -State Listen -ErrorAction SilentlyContinue
              if (-not $holding) {
                  $listener.Stop()
                  $listener = $null
                  Remove-Item Env:PORT -ErrorAction SilentlyContinue
                  Fail-Smoke "no LISTEN socket on port $conflictPort after TcpListener.Start()"
              }
              Pass-Smoke "exclusive TcpListener is holding 0.0.0.0:$conflictPort"

              $conflictOut = Join-Path $logs 'run-conflict.stdout.log'
              $conflictErr = Join-Path $logs 'run-conflict.stderr.log'
              $p4 = Start-Inventory -ExePath $exe -OutLog $conflictOut -ErrLog $conflictErr
              if (-not $p4.WaitForExit(60000)) {
                  Stop-InventoryProcess $p4
                  $listener.Stop()
                  $listener = $null
                  Remove-Item Env:PORT -ErrorAction SilentlyContinue
                  Fail-Smoke "Inventory.exe did not exit when port $conflictPort was occupied"
              }
              $p4.Refresh()
              if ($p4.ExitCode -eq 0) {
                  $listener.Stop()
                  $listener = $null
                  Remove-Item Env:PORT -ErrorAction SilentlyContinue
                  Fail-Smoke "Inventory.exe exited 0 although port $conflictPort was occupied"
              }
              $conflictText = ''
              if (Test-Path -LiteralPath $conflictErr) {
                  $conflictText = Get-Content -Raw -Encoding UTF8 $conflictErr
              }
              # PyInstaller uses an isolated interpreter config (PYTHON* env vars are
              # ignored), and redirected stderr uses the Windows locale codec with
              # backslashreplace, so non-ASCII text may appear as \uXXXX escapes.
              $expectedConflict = "端口 $conflictPort 被其他程序占用"
              $conflictEscaped = ($expectedConflict.ToCharArray() | ForEach-Object {
                  $code = [int][char]$_
                  if ($code -ge 32 -and $code -lt 127) { [string][char]$_ }
                  else { '\u{0:x4}' -f $code }
              }) -join ''
              $literalFound = $conflictText.Contains($expectedConflict)
              $escapedFound = $conflictText.Contains($conflictEscaped)
              if (-not ($literalFound -or $escapedFound)) {
                  $listener.Stop()
                  $listener = $null
                  Remove-Item Env:PORT -ErrorAction SilentlyContinue
                  Fail-Smoke "port conflict message missing from stderr: $conflictText"
              }
              $encodingForm = if ($literalFound) { 'literal UTF-8' } else { 'backslash-escaped' }
              Pass-Smoke "port conflict produced exit code $($p4.ExitCode) and the expected message ($encodingForm)"
              $listener.Stop()
              $listener = $null
              Remove-Item Env:PORT -ErrorAction SilentlyContinue
              $portFree = $false
              $freeDeadline = (Get-Date).AddSeconds(10)
              while ((Get-Date) -lt $freeDeadline) {
                  if (-not (Get-NetTCPConnection -LocalPort $conflictPort -State Listen -ErrorAction SilentlyContinue)) {
                      $portFree = $true
                      break
                  }
                  Start-Sleep -Milliseconds 500
              }
              if (-not $portFree) {
                  Fail-Smoke "port $conflictPort still has a LISTEN socket after the dummy listener stopped"
              }
              Pass-Smoke "dummy listener stopped; port $conflictPort is free"
          }
          finally {
              Stop-InventoryProcess $p1
              Stop-InventoryProcess $p2
              Stop-InventoryProcess $p3
              Stop-InventoryProcess $p4
              if ($null -ne $listener) {
                  try { $listener.Stop() } catch { }
              }
              Remove-Item Env:PORT -ErrorAction SilentlyContinue
              Get-Process -Name 'Inventory' -ErrorAction SilentlyContinue | ForEach-Object {
                  try { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue } catch { }
              }
              Write-SmokeLog 'cleanup completed'
          }

      - name: Upload exe and smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-windows
          path: |
            dist/Inventory.exe
            smoke-logs/
          if-no-files-found: warn
          retention-days: 7
